<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Album J&J</title>
    <meta name="description" content="Álbum de fotos y videos de Jennifer & John" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Memorias</p>
          <h1>Album J&J</h1>
          <p class="subtitle">Jennifer & John</p>
        </div>
        <button id="themeToggle" class="ghost-btn" type="button">Modo oscuro</button>
      </header>

      <main class="layout">
        <aside class="sidebar panel">
          <section>
            <h2>Subir contenido</h2>
            <form id="uploadForm" class="stack">
              <label class="field">
                <span>Título</span>
                <input id="mediaTitle" type="text" placeholder="Ej. Viaje a la playa" />
              </label>

              <label class="field">
                <span>Álbum</span>
                <select id="albumSelect"></select>
              </label>

              <label class="field upload-box">
                <span>Selecciona imagen o video</span>
                <input id="fileInput" type="file" accept="image/*,video/*" multiple />
              </label>

              <button type="submit" class="primary-btn">Guardar en álbum</button>
            </form>
          </section>

          <section class="section-divider">
            <h2>Crear álbum</h2>
            <form id="albumForm" class="stack">
              <label class="field">
                <span>Nombre del álbum</span>
                <input id="albumName" type="text" placeholder="Ej. Celebración" />
              </label>

              <label class="field">
                <span>Descripción</span>
                <textarea id="albumDescription" rows="3" placeholder="Qué recuerdos incluye este álbum..."></textarea>
              </label>

              <button type="submit" class="secondary-btn">Crear álbum</button>
            </form>
          </section>
        </aside>

        <section class="content panel">
          <div class="toolbar">
            <div class="filter-group">
              <button class="filter-btn active" data-filter="all" type="button">Todo</button>
              <button class="filter-btn" data-filter="favorites" type="button">Favoritos</button>
              <button class="filter-btn" data-filter="videos" type="button">Videos</button>
              <button class="filter-btn" data-filter="images" type="button">Imágenes</button>
            </div>
          </div>

          <div id="albumChips" class="album-chips"></div>
          <div id="gallery" class="gallery-grid"></div>
        </section>
      </main>
    </div>

    <template id="mediaTemplate">
      <article class="media-card">
        <div class="media-preview">
          <button class="favorite-btn" type="button" aria-label="Marcar favorito">♡</button>
        </div>
        <div class="media-meta">
          <div>
            <h3></h3>
            <span class="badge"></span>
          </div>
          <div class="media-actions">
            <button class="move-album-btn" type="button">Mover</button>
            <button class="delete-btn" type="button">Eliminar</button>
          </div>
        </div>
      </article>
    </template>

    <script src="/app.js"></script>
  </body>
</html>
